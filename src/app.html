<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Fetch the font with the page, so text is not drawn twice. -->
		<link rel="preload" href="/fonts/texgyreadventor-regular.otf" as="font" type="font/otf" crossorigin />
		<!-- The browser's own bar, in --page from app.css. -->
		<meta name="theme-color" content="#2d4a22" />
		<title>How The Horsey Moves</title>
		<meta name="description" content="Learn how chess pieces move through interactive puzzles" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
